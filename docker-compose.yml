services:
  radar:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      REQUIRE_FEEDBACK_TOKEN: "true"
      FEEDBACK_API_TOKEN: ${FEEDBACK_API_TOKEN:?set FEEDBACK_API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SIXTY_SECONDS_API_BASE_URL: https://60s.viki.moe/v2
      ALLOW_PUBLIC_HOTLIST: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: trend_radar
      MYSQL_USER: trend_radar
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - radar-data:/app/data
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trend_radar
      MYSQL_USER: trend_radar
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  radar-data:
  mysql-data:
